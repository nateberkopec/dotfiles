---
agent_resources:
  .agents/skills: skills
  .claude/skills: skills
  .codex/skills: skills
  .gemini/config/skills: skills
  .pi/agent/skills/claude: skills
  .pi/agent/agents/reviewer.md: agents/reviewer.md
  .agents/researcher.md: agents/researcher.md
standard_folders:
- Documents/Inbox
- Documents/Code.nosync
- Documents/Code.nosync/business
- Documents/Code.nosync/personal
- Documents/Code.nosync/upstream
- src/tries
debian_desktop_apps:
  - name: 1password
    package: 1password
    line: "deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main"
    key_url: https://downloads.1password.com/linux/keys/1password.asc
  - name: google-chrome
    package: google-chrome-stable
    line: "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-archive-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main"
    key_url: https://dl.google.com/linux/linux_signing_key.pub
vendor_apps:
  - name: 1Password
    url: https://downloads.1password.com/mac/1Password-latest-aarch64.zip
    archive: zip
    team_id: 2BUA8C4S2C
  - name: Ghostty
    url: https://release.files.ghostty.org/1.4.0/Ghostty.dmg
    archive: dmg
    team_id: 24VZTF6M5V
  - name: Google Chrome
    url: https://dl.google.com/chrome/mac/universal/stable/GGRO/googlechrome.dmg
    archive: dmg
    team_id: EQHXZ8M8AV
  - name: Tailscale
    url: https://pkgs.tailscale.com/stable/Tailscale-latest-macos.zip
    archive: zip
    team_id: W5364U7YZB
    admin_only: true
  - name: Visual Studio Code
    url: https://update.code.visualstudio.com/latest/darwin-arm64/stable
    archive: zip
    team_id: UBF8T346G9
    commands:
      code: Contents/Resources/app/bin/code
spotlight_exclusions:
- "~/Documents/Code.nosync"
- "~/src"
time_machine_settings:
  auto_backup: true
  auto_backup_interval_seconds: 86400
  requires_ac_power: true
  wake_time: "05:15:00"
  exclusions:
  - "~/Documents/Code.nosync"
  - "~/src"
  - "~/.bun/install/cache"
  - "~/.cache"
  - "~/.npm"
  - "~/Library/pnpm"
  - "~/.local/share/mise"
  - "~/Library/Application Support/com.apple.wallpaper/aerials/videos"
file_associations:
  com.microsoft.VSCode:
  - ".md"
vscode_extension_sources:
  nateberkopec.simple-yaml-tools:
    github: nateberkopec/simple-yaml-tools
    tag: v0.0.1
    asset: simple-yaml-tools-0.0.1.vsix
  nateberkopec.vscodevim-core:
    github: nateberkopec/vscodevim
    tag: core-v1.32.4
    asset: vscodevim-core-1.32.4.vsix
  nateberkopec.wordcount:
    github: nateberkopec/vscode-wordcount
    tag: v0.1.0-nate.1
    asset: wordcount.vsix
