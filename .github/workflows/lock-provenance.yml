name: Lock Provenance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      factory:
        type: boolean
        default: false
permissions: {contents: read, actions: read, pull-requests: read}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, platform: linux-x64}
          - {os: macos-latest, platform: macos-arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ inputs.factory && github.sha || github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: ruby/setup-ruby@4c56a21280b36d862b5fc31348f463d60bdc55d5
        with: {ruby-version: ruby, bundler-cache: true}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.factory
        with: {name: agent, path: /tmp/gh-aw}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.factory
        with: {name: dependency-start, path: /tmp/dependency-start}
      - name: Independently reproduce the exact lock
        env:
          FACTORY: ${{ inputs.factory }}
          NATIVE_PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$FACTORY" = true ]; then
            bundle exec ruby tools/ci/validate_dependency_publication.rb /tmp/gh-aw/agent /tmp/dependency-start "$RUNNER_TEMP/native"
          else
            bundle exec ruby tools/ci/reproduce_mise_lock.rb "$NATIVE_PLATFORM" "$RUNNER_TEMP/native"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: native-${{ github.run_attempt }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/native/*.sha
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: native-diagnostic-${{ github.run_attempt }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/native/*.lock
          if-no-files-found: ignore
