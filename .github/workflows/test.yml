name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Ruby
      uses: ruby/setup-ruby@4c56a21280b36d862b5fc31348f463d60bdc55d5 # v1.301.0
      with:
        ruby-version: 'ruby'
        bundler-cache: true

    - name: Install mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        install: false
        cache: true

    - name: Install Fish
      run: mise install aqua:fish-shell/fish-shell@4.8.1

    - name: Run tests
      run: MISE_EXPERIMENTAL=1 mise x aqua:fish-shell/fish-shell@4.8.1 -- bundle exec rake test
