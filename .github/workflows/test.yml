name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Ruby
      uses: ruby/setup-ruby@4c56a21280b36d862b5fc31348f463d60bdc55d5 # v1.301.0
      with:
        ruby-version: 'ruby'
        bundler-cache: true

    - name: Install mise-managed Node, Pi runtime, and TypeScript
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        cache: true
        experimental: true

    - name: Install frozen JavaScript dependencies
      run: mise exec -- aube install --frozen-lockfile --ignore-scripts

    - name: Set up uv for skill-creator script tests
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: false

    - name: Run OpenRouter US regressions without skips
      run: bundle exec ruby -Itest test/dotfiles/hooks/openrouter_us_catalog_test.rb --verbose && bundle exec ruby -Itest test/dotfiles/hooks/openrouter_us_runtime_test.rb --verbose

    - name: Type-check Pi extensions
      run: tools/typecheck_pi_extensions.sh

    - name: Test Pi extensions
      run: node --test test/*_test.mjs

    - name: Install checksum-pinned Herdr for CLI contract tests
      run: bash tools/ci/install_herdr.sh

    - name: Run tests with managed Bash startup
      timeout-minutes: 5
      env:
        REQUIRE_HERDR: "1"
      run: bundle exec rake test
