name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Ruby
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: 'ruby'
        bundler-cache: true

    - name: Install mise-managed Node, Pi runtime, and TypeScript
      uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      with:
        cache: true
        experimental: true

    - name: Install frozen JavaScript dependencies
      run: mise exec -- aube install --frozen-lockfile --ignore-scripts

    - name: Install pinned agent package for shared tooling and installation tests
      run: bash tools/install-agent-stuff.sh

    - name: Type-check Pi extensions
      run: tools/typecheck_pi_extensions.sh

    - name: Test Pi extensions
      run: node --test test/*_test.mjs

    - name: Install pinned Fish for shell routing tests
      run: mise install aqua:fish-shell/fish-shell@4.9.3

    - name: Run tests with managed Bash startup
      timeout-minutes: 5
      run: mise exec aqua:fish-shell/fish-shell@4.9.3 -- bundle exec rake test
