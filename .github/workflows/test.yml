name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Ruby
      uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
      with:
        ruby-version: 'ruby'
        bundler-cache: true

    - name: Install mise-managed Node, Pi runtime, and TypeScript
      uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        cache: true
        experimental: true

    - name: Install frozen JavaScript dependencies
      run: mise exec -- aube install --frozen-lockfile --ignore-scripts

    - name: Install pinned agent package for shared tooling and installation tests
      run: bash tools/install-agent-stuff.sh

    - name: Type-check Pi extensions
      run: tools/typecheck_pi_extensions.sh

    - name: Test Pi extensions
      run: node --test test/*_test.mjs

    - name: Install pinned Fish for shell routing tests
      run: mise install aqua:fish-shell/fish-shell@4.9.3

    - name: Run tests with managed Bash startup
      timeout-minutes: 5
      run: mise exec aqua:fish-shell/fish-shell@4.9.3 -- bundle exec rake test
