name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_TASK_RUN_AUTO_INSTALL: '0'

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Ruby
      uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      with:
        ruby-version: 'ruby'
        bundler-cache: true

    - name: Enforce mechanical dependency updates
      if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'dependency-update')
      run: bundle exec ruby tools/ci/check_dependency_update.rb "${{ github.event.pull_request.base.sha }}"

    - name: Install mise
      uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        install: false
        cache: true
        experimental: true

    - name: Install gitleaks
      run: mise use -g "gitleaks@$(awk -F '\"' '/^gitleaks = / { print $2 }' files/home/.config/mise/config.toml)"

    - name: Install JavaScript lint dependencies
      run: |
        mise install
        mise exec -- aube install --frozen-lockfile --ignore-scripts

    - name: Install pinned agent package for shared tooling
      run: bash tools/install-agent-stuff.sh

    - name: Run lint
      run: mise run lint
