name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_TASK_RUN_AUTO_INSTALL: '0'

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Ruby
      uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: 'ruby'
        bundler-cache: true

    - name: Enforce mechanical dependency updates
      if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'dependency-update')
      run: bundle exec ruby tools/ci/check_dependency_update.rb "${{ github.event.pull_request.base.sha }}"

    - name: Install mise
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        install: false
        cache: true
        experimental: true

    - name: Install gitleaks
      run: mise use -g "gitleaks@$(awk -F '\"' '/^gitleaks = / { print $2 }' files/home/.config/mise/config.toml)"

    - name: Install JavaScript lint dependencies
      run: |
        mise install
        mise exec -- aube install --frozen-lockfile --ignore-scripts

    - name: Install pinned agent package for shared tooling
      run: bash tools/install-agent-stuff.sh

    - name: Run lint
      run: mise run lint
