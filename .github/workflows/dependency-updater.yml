name: Dependency Software Factory

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

concurrency:
  group: dependency-software-factory
  cancel-in-progress: false

jobs:
  start-copilot-batch:
    runs-on: ubuntu-latest
    env:
      TASK_MARKER: "[Dependency Software Factory]"
      TASK_PROMPT: >-
        [Dependency Software Factory] Follow .github/dependency-updater.md exactly.
        Work in one pull request and apply the dependency-update label.
        If no eligible candidates exist, summarize the checks performed and close the empty pull request.
    steps:
      - name: Ensure updater label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create dependency-update \
            --color 5319e7 \
            --description "One dependency software-factory batch" \
            --force

      - name: Find an unfinished pull request
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(gh pr list \
            --state open \
            --label dependency-update \
            --limit 1 \
            --json url \
            --jq '.[0].url // empty')"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Find an unfinished Copilot task
        id: task
        if: steps.pull_request.outputs.url == ''
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "COPILOT_ASSIGNMENT_TOKEN is required; see README.md." >&2
            exit 1
          fi

          task_ids="$(gh api \
            --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "agents/repos/${REPOSITORY}/tasks" \
            -f state='queued,in_progress,idle,waiting_for_user' \
            -F per_page=100 \
            --jq '.tasks[].id')"

          url=""
          while IFS= read -r task_id; do
            [ -n "$task_id" ] || continue
            task="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "agents/repos/${REPOSITORY}/tasks/${task_id}")"
            if jq -e --arg marker "$TASK_MARKER" \
              '[.sessions[]?.prompt] | any(startswith($marker))' <<< "$task" >/dev/null; then
              url="$(jq -r '.html_url // .url' <<< "$task")"
              break
            fi
          done <<< "$task_ids"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Reuse the unfinished batch
        if: steps.pull_request.outputs.url != '' || steps.task.outputs.url != ''
        env:
          PULL_REQUEST_URL: ${{ steps.pull_request.outputs.url }}
          TASK_URL: ${{ steps.task.outputs.url }}
        run: |
          url="${PULL_REQUEST_URL:-$TASK_URL}"
          printf 'An updater batch is already open: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Start a Copilot task
        if: steps.pull_request.outputs.url == '' && steps.task.outputs.url == ''
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          run_url="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          prompt="${TASK_PROMPT} Factory run: ${run_url}"
          payload="$(jq -n \
            --arg prompt "$prompt" \
            '{prompt: $prompt, base_ref: "main", create_pull_request: true}')"

          task_url="$(gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "agents/repos/${REPOSITORY}/tasks" \
            --input - <<< "$payload" \
            --jq '.html_url // .url')"
          printf 'Started Copilot dependency batch: %s\n' "$task_url" >> "$GITHUB_STEP_SUMMARY"
