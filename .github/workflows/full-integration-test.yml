name: Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      integration_optional: ${{ steps.integration_optional.outputs.integration_optional }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Detect changes that do not need integration
      id: integration_optional
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: bash tools/ci/detect_optional_integration.sh "${{ github.event_name }}" "$BASE_SHA" "$HEAD_SHA"

  integration-test:
    name: integration-test (${{ matrix.os }})
    needs: detect-changes
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.integration_optional == 'false' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            mise_ci_tools: "gum,github:aubepkg/aube,npm:@earendil-works/pi-coding-agent,fzf,aqua:fish-shell/fish-shell,pipx,pipx:playwright,github:abue-ammar/tinycast"
          - os: ubuntu-22.04
            mise_ci_tools: "gum,github:aubepkg/aube,npm:@earendil-works/pi-coding-agent,fzf,aqua:fish-shell/fish-shell,pipx,pipx:playwright"

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Ruby
      uses: ruby/setup-ruby@4c56a21280b36d862b5fc31348f463d60bdc55d5 # v1.301.0
      with:
        ruby-version: 'ruby'
        bundler-cache: false

    - name: Run dotfiles integration script
      id: run
      timeout-minutes: 20
      env:
        DEBUG: true
        CI: true
        NONINTERACTIVE: true
        AUBE_DISABLE_TARBALL_STREAM: "1"
        GITHUB_TOKEN: ${{ github.token }}
        MISE_CI_TOOLS: ${{ matrix.mise_ci_tools }}
        BREW_CI_PACKAGES: "duti"
        BREW_CI_CASKS: ""
        DEBIAN_CI_PACKAGES: "trash-cli"
        DEBIAN_CI_DESKTOP_APPS: ""
      run: bash tools/ci/run_dotfiles_integration.sh "${GITHUB_WORKSPACE}"

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: logs-${{ matrix.os }}
        path: |
          output.log
          output-second.log
          fish-init.log
        retention-days: 7

  non-admin-integration-test:
    needs: detect-changes
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.integration_optional == 'false' }}
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Ruby
      uses: ruby/setup-ruby@4c56a21280b36d862b5fc31348f463d60bdc55d5 # v1.301.0
      with:
        ruby-version: 'ruby'
        bundler-cache: false

    - name: Prepare non-admin macOS runner user
      run: |
        set -euo pipefail

        username="dotfiles-ci"
        home_dir="/Users/${username}"
        repo_dir="${home_dir}/dotfiles"

        if ! id -u "${username}" >/dev/null 2>&1; then
          next_uid="$(dscl . -list /Users UniqueID | awk '{print $2}' | sort -n | tail -1)"
          next_uid="$((next_uid + 1))"
          sudo dscl . -create "/Users/${username}"
          sudo dscl . -create "/Users/${username}" UserShell /bin/bash
          sudo dscl . -create "/Users/${username}" RealName "Dotfiles CI"
          sudo dscl . -create "/Users/${username}" UniqueID "${next_uid}"
          sudo dscl . -create "/Users/${username}" PrimaryGroupID 20
          sudo dscl . -create "/Users/${username}" NFSHomeDirectory "${home_dir}"
          sudo createhomedir -c -u "${username}" >/dev/null
        fi

        sudo rm -rf "${home_dir}/.homebrew" "${home_dir}/Library/Caches/Homebrew"
        sudo mkdir -p "${repo_dir}"
        sudo rsync -a --delete --exclude .git "${GITHUB_WORKSPACE}/" "${repo_dir}/"
        sudo chown -R "${username}:staff" "${home_dir}"
        sudo -H -u "${username}" bash -lc '
          if id -Gn | tr " " "\n" | grep -qx admin; then
            echo "User unexpectedly has admin rights"
            exit 1
          fi
        '

    - name: Seed immutable gem credentials for non-admin user
      run: |
        set -euo pipefail

        username="dotfiles-ci"

        sudo -H -u "${username}" bash <<'BASH'
        set -euo pipefail
        mkdir -p "$HOME/.gem"
        cp "$HOME/dotfiles/files/home/.gem/credentials" "$HOME/.gem/credentials"
        printf '\n# stale copy for integration test\n' >> "$HOME/.gem/credentials"
        chflags uchg "$HOME/.gem/credentials"
        ls -lO "$HOME/.gem/credentials"
        BASH

    - name: Seed externally managed git hooks for non-admin user
      run: |
        set -euo pipefail

        hooks_dir="/Users/dotfiles-ci/.git-hooks"
        sudo mkdir -p "${hooks_dir}"
        printf '# external pre-commit\n' | sudo tee "${hooks_dir}/pre-commit" >/dev/null
        printf '# external pre-push\n' | sudo tee "${hooks_dir}/pre-push" >/dev/null
        sudo chmod 555 "${hooks_dir}"
        sudo chmod 444 "${hooks_dir}/pre-commit" "${hooks_dir}/pre-push"

    - name: Run dotfiles integration script as non-admin macOS user
      id: non_admin_run
      timeout-minutes: 20
      env:
        DEBUG: true
        CI: true
        NONINTERACTIVE: true
        AUBE_DISABLE_TARBALL_STREAM: "1"
        GITHUB_TOKEN: ${{ github.token }}
        MISE_CI_TOOLS: "gum,github:aubepkg/aube,npm:@earendil-works/pi-coding-agent,fzf,aqua:fish-shell/fish-shell,pipx,pipx:playwright,github:abue-ammar/tinycast"
        BREW_CI_PACKAGES: "duti"
        BREW_CI_CASKS: ""
      run: |
        set -euo pipefail

        username="dotfiles-ci"
        home_dir="/Users/${username}"
        runner_path="$PATH"

        sudo -H -u "${username}" env \
          HOME="${home_dir}" \
          PATH="${home_dir}/.homebrew/bin:${runner_path}:${home_dir}/.local/bin" \
          DEBUG="${DEBUG}" \
          CI="${CI}" \
          NONINTERACTIVE="${NONINTERACTIVE}" \
          AUBE_DISABLE_TARBALL_STREAM="${AUBE_DISABLE_TARBALL_STREAM}" \
          GITHUB_TOKEN="${GITHUB_TOKEN}" \
          MISE_CI_TOOLS="${MISE_CI_TOOLS}" \
          BREW_CI_PACKAGES="${BREW_CI_PACKAGES}" \
          BREW_CI_CASKS="${BREW_CI_CASKS}" \
          bash "${home_dir}/dotfiles/tools/ci/run_dotfiles_integration.sh" "${home_dir}/dotfiles"

    - name: Verify externally managed git hooks were skipped
      run: |
        set -euo pipefail

        home_dir="/Users/dotfiles-ci"
        test "$(sudo cat "${home_dir}/.git-hooks/pre-commit")" = "# external pre-commit"
        test "$(sudo cat "${home_dir}/.git-hooks/pre-push")" = "# external pre-push"
        grep -F "dotfiles: skipping git hook sync; ${home_dir}/.git-hooks is not writable" "${home_dir}/dotfiles/output.log"
        grep -F "dotfiles: skipping git hook sync; ${home_dir}/.git-hooks is not writable" "${home_dir}/dotfiles/output-second.log"

    - name: Upload non-admin logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: logs-macos-latest-non-admin
        path: |
          /Users/dotfiles-ci/dotfiles/output.log
          /Users/dotfiles-ci/dotfiles/output-second.log
          /Users/dotfiles-ci/dotfiles/fish-init.log
        retention-days: 7

  integration-result:
    needs: [detect-changes, integration-test, non-admin-integration-test]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout result checker
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Require successful integration result
      env:
        DETECTION_RESULT: ${{ needs.detect-changes.result }}
        INTEGRATION_OPTIONAL: ${{ needs.detect-changes.outputs.integration_optional }}
        PLATFORM_RESULT: ${{ needs.integration-test.result }}
        NON_ADMIN_RESULT: ${{ needs.non-admin-integration-test.result }}
      run: bash tools/ci/check_integration_results.sh "$DETECTION_RESULT" "$INTEGRATION_OPTIONAL" "$PLATFORM_RESULT" "$NON_ADMIN_RESULT"
