[env]
_.path = ["./bin"]
_.file = ".env"
BUNDLE_PATH = "vendor/bundle"

[shell_alias]
dfr = "./bin/dotf run"

[tools]
node = "26.10.0"
"github:aubepkg/aube" = "2.6.1"
"npm:typescript" = "7.0.2"
"npm:@earendil-works/pi-coding-agent" = "1.1.0"

[deps.bundler]
auto = true

[deps.javascript]
auto = true
sources = ["package.json", "aube-lock.yaml"]
outputs = ["node_modules/.aube-state"]
run = "aube install --frozen-lockfile --ignore-scripts"

[deps.hk]
sources = ["hk.pkl"]
outputs = [".git/hooks/pre-commit"]
run = "hk install"

[tasks.setup]
description = "Install project dependencies and git hooks"
run = "mise deps"

[tasks."lint:standard"]
description = "Run standardrb"
sources = ["**/*.rb", "!tmp/**", "!vendor/**", "!.claude/worktrees/**", "!.pi-subagents/**", ".standard.yml"]
run = "bundle exec standardrb"

[tasks."lint:complexity"]
description = "Run Ruby complexity checks"
sources = ["**/*.rb", "!tmp/**", "!vendor/**", "!.claude/worktrees/**", "!.pi-subagents/**", ".rubocop-custom.yml"]
run = "bundle exec rubocop --config .rubocop-custom.yml --only Metrics/PerceivedComplexity"

[tasks."lint:human-only"]
description = "Check staged files for human-only paths"
run = "ruby tools/check_human_only_files.rb"

[tasks."lint:secrets"]
description = "Scan working tree for hardcoded secrets"
run = "gitleaks dir --redact=75 --no-banner --no-color --max-target-megabytes 5 --config files/home/.agents/skills/dev-env-setup/scripts/check-dev-env/gitleaks-default.toml ."

[tasks."lint:dead-code"]
description = "Check for dead Ruby methods"
sources = ["**/*.rb", "**/*.rake", "!tmp/**", "!vendor/**", "!.claude/worktrees/**", "!.pi-subagents/**", "bin/*", "Rakefile", ".debride-whitelist", "files/home/.agents/skills/dev-env-setup/scripts/check_dead_code.rb"]
run = "ruby files/home/.agents/skills/dev-env-setup/scripts/check_dead_code.rb"

[tasks."lint:flog"]
description = "Run flog complexity checks"
sources = ["**/*.rb", "!tmp/**", "!vendor/**", "!.claude/worktrees/**", "!.pi-subagents/**", "Rakefile"]
run = "bundle exec rake flog"

[tasks."lint:flay"]
description = "Run flay duplication checks"
sources = ["**/*.rb", "!tmp/**", "!vendor/**", "!.claude/worktrees/**", "!.pi-subagents/**", "Rakefile"]
run = "bundle exec rake flay"

[tasks."lint:skills"]
description = "Validate agent skills"
sources = ["files/home/.agents/skills/**", "tools/lint_agent_skills.rb"]
run = "ruby tools/lint_agent_skills.rb"

[tasks."format:javascript"]
description = "Format repository-owned JavaScript and TypeScript"
run = "node_modules/.bin/oxfmt '**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}' '.pi/**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}'"

[tasks."lint:anti-slop"]
description = "Check JavaScript and TypeScript with Mulroy's anti-slop rules"
sources = [".pi/**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}", "**/*.ts", "**/*.tsx", "**/*.mts", "**/*.cts", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs", "!node_modules/**", "!vendor/**", "!tmp/**", "!.claude/worktrees/**", "!.pi-subagents/**", ".oxlintrc.json", "package.json", "aube-lock.yaml"]
run = "node_modules/.bin/oxlint --config .oxlintrc.json --deny-warnings --no-ignore . .pi/extensions/*/*.ts"

[tasks.lint]
description = "Run all lint checks"
depends = ["lint:standard", "lint:complexity", "lint:human-only", "lint:secrets", "lint:dead-code", "lint:flog", "lint:flay", "lint:skills", "lint:anti-slop"]

[tasks.test]
description = "Run the test suite"
sources = [".pi/**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}", "**/*.rb", "**/*.ts", "**/*.tsx", "**/*.mts", "**/*.cts", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs", "!node_modules/**", "!tmp/**", "!vendor/**", "!.claude/worktrees/**", "!.pi-subagents/**", "test/**/*", "lib/**/*", "tools/typecheck_pi_extensions.sh", "package.json", "aube-lock.yaml"]
run = """
bundle exec rake test
tools/typecheck_pi_extensions.sh
"""

[tasks.dev]
description = "Run dotfiles setup on the current machine"
run = "./bin/dotf run"

[tasks.build]
description = "Build the Ubuntu 22.04 test container"
run = "docker build --platform linux/amd64 -f tools/ubuntu-22.04/Dockerfile -t dotfiles-ubuntu-22.04 ."
