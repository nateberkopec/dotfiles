# Managed by dotfiles. This file is the source of truth for machine-wide mise tools.
[tools]
ruby = "4.0.6"
node = "26.8.1"
"github:aubepkg/aube" = "2.2.4"
go = "1.27.0"
rust = "1.98.0"
hk = "1.56.1"
"cargo:broot" = "1.59.0"
"cargo:difftastic" = "0.70.0"
"cargo:starship" = "1.26.0"
"npm:@openai/codex" = { version = "0.151.0", depends = ["github:aubepkg/aube"] }
"npm:sfw" = { version = "2.0.6", depends = ["github:aubepkg/aube"] }
pipx = "1.16.7"
"pipx:playwright" = { version = "1.62.0", depends = ["pipx"] }
"npm:@earendil-works/pi-coding-agent" = { version = "0.84.4", depends = ["github:aubepkg/aube"], minimum_release_age = "0d", aube_args = "--deny-build=@google/genai --deny-build=protobufjs" }
"go:github.com/mikefarah/yq/v4" = "4.53.6"
"go:github.com/noperator/yknotify" = "0.0.0-20260324103239-0c773bdadedb"
"github:aldanial/cloc" = { version = "2.10", asset_pattern = "cloc-{{version}}.pl", bin = "cloc" }
"github:pkgforge-dev/ghostty-appimage[bin=ghostty]" = { version = "1.3.1", os = ["linux"] }
"github:nateberkopec/print-label" = "0.3.0"
"github:BarutSRB/OmniWM" = { version = "0.6.4", asset_pattern = "OmniWM-v{{version}}.zip", bin_path = "OmniWM.app/Contents/MacOS", os = ["macos"], arch = ["arm64"] }
watchexec = "2.7.0"
fnox = "1.31.1"
bat = "0.26.1"
eza = "0.23.5"
cmake = "4.4.3"
fd = "10.5.0"
fzf = "0.74.3"
"aqua:fish-shell/fish-shell" = "4.8.1"
gh = "2.98.0"
git-lfs = "3.8.0"
gum = "2.0.0"
jq = "1.8.2"
lazygit = "0.64.1"
ripgrep = "15.2.0"
shellcheck = "0.11.0"
tmux = "3.7c"
zoxide = "0.10.0"
pkl = "0.32.1"
claude = "2.1.220"
gitleaks = "8.30.1"
"1password-cli" = "2.39.0"
heroku = { version = "11.10.0", depends = ["github:aubepkg/aube"], aube_args = "--deny-build=cpu-features --deny-build=protobufjs --deny-build=ssh2 --deny-build=yarn" }
"github:rawnly/splash-cli" = "4.1.7"

[tools."github:nateberkopec/try"]
version = "1.10.1"
bin = "try"

[tools."github:nateberkopec/try".platforms]
linux-x64 = { asset_pattern = "try-v1.10.1-linux-x64.tar.gz" }
macos-arm64 = { asset_pattern = "try-v1.10.1-macos-arm64.tar.gz" }

[settings]
env_shell_expand = false
idiomatic_version_file_enable_tools = ["ruby", "node"]
legacy_version_file = true
experimental = true
npm.package_manager = "aube"
github.credential_command = "gh auth token"
fetch_remote_versions_cache = "7d"
minimum_release_age = "3d"
http_timeout = "5s"
fetch_remote_versions_timeout = "5s"

[env]
AUBE_SECURITY_SCANNER = "{{env.HOME}}/.config/aube/socket-security-scanner.mjs"
BASH_ENV = "{{env.HOME}}/.config/bash/safety.bash"
CARGO_HTTP_TIMEOUT = "5"
GO_GET_TIMEOUT = "5s"

# Desktop packages (1password and google-chrome) retain specialized installers.
# docker.io stays conditional to preserve other installations.
[bootstrap.packages]
"brew:automake" = "latest"
"brew:bash" = "latest"
"brew:bison" = "latest"
"brew:coreutils" = "latest"
"brew:curl" = "latest"
"brew:duti" = "latest"
"brew:fontconfig" = "latest"
"brew:git" = "latest"
"brew:gnupg" = "latest"
"brew:jemalloc" = "latest"
"brew:jpeg" = "latest"
"brew:libffi" = "latest"
"brew:libheif" = "latest"
"brew:libmagic" = "latest"
"brew:libpq" = "latest"
"brew:librsvg" = "latest"
"brew:libyaml" = "latest"
"brew:llm" = "latest"
"brew:pinentry-mac" = "latest"
"brew:pkgconf" = "latest"
"brew:terminal-notifier" = "latest"
"brew:trash" = "latest"
"brew:ykman" = "latest"
"apt:automake" = "latest"
"apt:bash" = "latest"
"apt:bison" = "latest"
"apt:coreutils" = "latest"
"apt:curl" = "latest"
"apt:fontconfig" = "latest"
"apt:git" = "latest"
"apt:gnupg" = "latest"
"apt:libffi-dev" = "latest"
"apt:libheif-dev" = "latest"
"apt:libjemalloc-dev" = "latest"
"apt:libjpeg-dev" = "latest"
"apt:libmagic-dev" = "latest"
"apt:libpq-dev" = "latest"
"apt:librsvg2-dev" = "latest"
"apt:libyaml-dev" = "latest"
"apt:pinentry-tty" = "latest"
"apt:pkgconf" = "latest"
"apt:trash-cli" = "latest"
"apt:yubikey-manager" = "latest"

# The whole-tree copy mirrors files/home into ~. Platform-specific files render
# through mise's template engine; explicit entries create command/config links.
[dotfiles]
"~" = { source = "~/.dotfiles/files/home", mode = "copy" }
"~/.config/fish/conf.d/platform.fish" = { source = "~/.dotfiles/files/templates/platform.fish", mode = "template" }
"~/.config/ghostty/config.platform" = { source = "~/.dotfiles/files/templates/ghostty-config.platform", mode = "template" }
"~/.local/bin/dotf" = { source = "~/.dotfiles/bin/dotf", mode = "symlink" }
"~/.local/share/yknotify/yknotify.sh" = { source = "~/.dotfiles/files/yknotify/yknotify.sh", mode = "copy" }
"~/.local/share/yknotify/yubikey-icon.png" = { source = "~/.dotfiles/files/yknotify/yubikey-icon.png", mode = "copy" }
"~/.agents/skills" = { source = "~/.dotfiles/files/home/.claude/skills", mode = "symlink" }
"~/.codex/skills" = { source = "~/.dotfiles/files/home/.claude/skills", mode = "symlink" }
"~/.pi/agent/skills/claude" = { source = "~/.dotfiles/files/home/.claude/skills", mode = "symlink" }
"~/.codex/AGENTS.md" = { source = "~/.dotfiles/files/home/.claude/CLAUDE.md", mode = "symlink" }
"~/.pi/agent/AGENTS.md" = { source = "~/.dotfiles/files/home/.claude/CLAUDE.md", mode = "symlink" }

[bootstrap.macos.defaults.NSGlobalDomain]
NSAutomaticWindowAnimationsEnabled = 0
NSScrollAnimationEnabled = 0
QLPanelAnimationDuration = 0
NSScrollViewRubberbanding = 0
NSDocumentRevisionsWindowTransformAnimation = 0
NSToolbarFullScreenAnimationDuration = 0
NSBrowserColumnAnimationSpeedMultiplier = 0
"com.apple.mouse.scaling" = 2.0

[bootstrap.macos.defaults."com.apple.Accessibility"]
ReduceMotionEnabled = 1

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true
orientation = "left"
autohide-time-modifier = 0
autohide-delay = 0
springboard-show-duration = 0
springboard-hide-duration = 0
springboard-page-duration = 0
launchanim = 0
mineffect = "scale"

[bootstrap.macos.defaults."com.apple.finder"]
DisableAllAnimations = 1

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking = 0
TrackpadRightClick = 1
FirstClickThreshold = 1
ActuateDetents = 1
DragLock = 0
Dragging = 0
ForceSuppressed = 0
TrackpadCornerSecondaryClick = 0
TrackpadTwoFingerDoubleTapGesture = 1

[bootstrap.macos.defaults."com.apple.spaces"]
spans-displays = false

[bootstrap.macos.defaults."com.raycast.macos"]
raycastGlobalHotkey = "Command-49"
onboarding_setupHotkey = true

[bootstrap.macos.launchd.agents.time-machine-backup]
program = "~/.local/share/dotfiles/run-time-machine-backup.fish"
environment = { PATH = "{{env.HOME}}/.local/share/mise/shims:/usr/bin:/bin" }
start_calendar_interval = { hour = 5, minute = 15 }
stdout_path = "~/Library/Logs/time-machine-backup.out.log"
stderr_path = "~/Library/Logs/time-machine-backup.err.log"

[bootstrap.macos.launchd.agents.woodblock-wallpaper]
program = "~/.local/share/dotfiles/launch-woodblock-wallpaper"
run_at_load = true
environment = { PATH = "/usr/bin:/bin" }
start_calendar_interval = { hour = 5, minute = 0 }
stdout_path = "~/Library/Logs/woodblock-wallpaper.out.log"
stderr_path = "~/Library/Logs/woodblock-wallpaper.err.log"
kickstart = true

[bootstrap.macos.launchd.agents.yknotify]
program = "~/.local/share/yknotify/yknotify.sh"
run_at_load = true
keep_alive = true
stdout_path = "/tmp/yknotify.out"
stderr_path = "/tmp/yknotify.err"

[bootstrap.macos.launchd.agents.omniwm]
program = "~/.local/share/dotfiles/launch-omniwm"
run_at_load = true
stdout_path = "~/Library/Logs/omniwm-launcher.out.log"
stderr_path = "~/Library/Logs/omniwm-launcher.err.log"

[bootstrap.hooks]
pre-dotfiles = 'bash "$HOME/.dotfiles/bin/lib/unprotect-managed-files.sh"'
post-dotfiles = 'bash "$HOME/.dotfiles/bin/lib/post-dotfiles-hook.sh"'
pre-defaults = 'bash "$HOME/.dotfiles/bin/lib/pre-defaults-hook.sh"'
post-defaults = 'bash "$HOME/.dotfiles/bin/lib/post-defaults-hook.sh"'
post-packages = '[ ! -f /etc/debian_version ] || command -v docker >/dev/null 2>&1 || sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io'
