id = "dotfiles.workspace-prefix"
name = "Workspace Agent Prefix"
version = "0.2.0"
min_herdr_version = "0.9.3"
description = "Prefix live agent titles with their current space's first three non-whitespace characters"
platforms = ["macos", "linux"]

[[startup]]
command = ["mise", "exec", "--", "node", "index.mjs"]

[[actions]]
id = "refresh"
title = "Refresh workspace agent prefixes"
contexts = ["workspace"]
command = ["mise", "exec", "--", "node", "index.mjs"]

[[events]]
on = "pane.agent_detected"
command = ["mise", "exec", "--", "node", "index.mjs"]
